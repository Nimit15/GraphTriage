<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">GraphTriage</title>
  <desc id="desc">Graph-grounded incident resolution and temporal memory, backed by FalkorDB.</desc>
