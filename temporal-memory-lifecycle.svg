<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Temporal memory lifecycle</title>
  <desc id="desc">Episodic incidents preserve events, semantic facts store learned knowledge, and procedural playbooks retain reusable steps. A newer semantic fact points to the older superseded fact.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#64748B"/></marker><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#102235}.sub{font-size:16px;fill:#536779}.h{font-size:19px;font-weight:700;fill:#102235}.body{font-size:16px;fill:#30465A}.small{font-size:14px;fill:#536779}</style></defs>
  <rect width="1200" height="490" rx="16" fill="#F7F9FC" stroke="#D7E0E8"/>
  <text class="title" x="38" y="48">Temporal memory</text><text class="sub" x="38" y="76">Three distinct record types serve different memory needs.</text>
  <g>
    <rect x="38" y="112" width="350" height="156" rx="12" fill="#FFFFFF" stroke="#B4D6E5" stroke-width="1.5"/><rect x="38" y="112" width="350" height="7" rx="3.5" fill="#0E7490"/><text class="h" x="60" y="151">EpisodicIncident</text><text class="body" x="60" y="183">A specific occurrence</text><text class="body" x="60" y="210">Stack trace, failing test, timestamp</text><text class="small" x="60" y="242">Captures what happened.</text>
    <rect x="425" y="112" width="350" height="156" rx="12" fill="#FFFFFF" stroke="#A7D7C1" stroke-width="1.5"/><rect x="425" y="112" width="350" height="7" rx="3.5" fill="#059669"/><text class="h" x="447" y="151">SemanticFact</text><text class="body" x="447" y="183">Learned root-cause knowledge</text><text class="body" x="447" y="210">Fact type, content, validity interval</text><text class="small" x="447" y="242">Current status: ACTIVE</text>
    <rect x="812" y="112" width="350" height="156" rx="12" fill="#FFFFFF" stroke="#C7B9E8" stroke-width="1.5"/><rect x="812" y="112" width="350" height="7" rx="3.5" fill="#7C3AED"/><text class="h" x="834" y="151">ProceduralPlaybook</text><text class="body" x="834" y="183">Reusable remediation steps</text><text class="body" x="834" y="210">Prerequisites, steps, success criteria</text><text class="small" x="834" y="242">Captures how to respond.</text>
  </g>
  <text class="h" x="38" y="314">Fact supersession</text><text class="sub" x="38" y="339">A new fact links to the old fact; historical information remains queryable.</text>
  <rect x="38" y="365" width="440" height="94" rx="10" fill="#E8F7EF" stroke="#8CC9AA"/><text x="60" y="393" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#166534">New fact · ACTIVE</text><text class="body" x="60" y="419">valid_from: new timestamp</text><text class="body" x="60" y="443">valid_to: null · status: ACTIVE</text>
  <path d="M478 411 H700" stroke="#FF8101" stroke-width="2.5" marker-end="url(#arrow)"/><text x="589" y="396" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#A84C00">[:SUPERSEDED]</text><text x="589" y="433" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#536779">new → old</text>
  <rect x="709" y="365" width="453" height="94" rx="10" fill="#FFF3E8" stroke="#F2BA83"/><text x="731" y="393" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9A3412">Previous fact · historical</text><text class="body" x="731" y="419">valid_to: supersession timestamp</text><text class="body" x="731" y="443">status: SUPERSEDED</text>
</svg>