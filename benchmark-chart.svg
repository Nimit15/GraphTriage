<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="barGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="450" fill="url(#bgGrad)"/>

  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="450" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white">Performance Benchmarks — FalkorDB Engine Metrics</text>
  <text x="500" y="55" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94a3b8">Measured on FalkorDB Cloud (docker) • 10 iterations per test • sandbox_service graph with 12 functions, 8 tests</text>

  <!-- Chart 1: Engine Execution Time (Log scale bar chart) -->
  <g transform="translate(60, 85)">
    <text x="0" y="0" font-family="system-ui" font-size="13" font-weight="600" fill="white">Engine Execution Time (Cypher Query Latency)</text>

    <!-- Y-axis labels (log scale) -->
    <g font-family="system-ui" font-size="9" fill="#94a3b8">
      <text x="-10" y="20" text-anchor="end">1ms</text>
      <text x="-10" y="80" text-anchor="end">10ms</text>
      <text x="-10" y="140" text-anchor="end">100ms</text>
      <text x="-10" y="200" text-anchor="end">1000ms</text>
    </g>

    <!-- Grid lines -->
    <g stroke="#334155" stroke-width="0.5">
      <line x1="0" y1="20" x2="380" y2="20"/>
      <line x1="0" y1="80" x2="380" y2="80"/>
      <line x1="0" y1="140" x2="380" y2="140"/>
      <line x1="0" y1="200" x2="380" y2="200"/>
    </g>

    <!-- Bars (log scale positioning: log10(ms) * 60 + 20) -->
    <!-- shortestPath: 95ms -> log10(95) ≈ 1.98 -> y = 20 + 1.98*60 ≈ 139 -->
    <g transform="translate(50, 0)">
      <rect x="0" y="139" width="60" height="81" rx="4" fill="url(#barGrad1)" filter="url(#barGlow)"/>
      <text x="30" y="130" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#06b6d4">95ms</text>
      <text x="30" y="155" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">p50: 89ms</text>
      <text x="30" y="230" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="white">shortestPath</text>
      <text x="30" y="245" text-anchor="middle" font-family="system-ui" font-size="8" fill="#64748b">failure tracing</text>
    </g>

    <!-- PageRank: 28.6ms -> log10(28.6) ≈ 1.46 -> y = 20 + 1.46*60 ≈ 107 -->
    <g transform="translate(135, 0)">
      <rect x="0" y="107" width="60" height="113" rx="4" fill="url(#barGrad2)" filter="url(#barGlow)"/>
      <text x="30" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#8b5cf6">28.6ms</text>
      <text x="30" y="123" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">p50: 27.6ms</text>
      <text x="30" y="230" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="white">PageRank</text>
      <text x="30" y="245" text-anchor="middle" font-family="system-ui" font-size="8" fill="#64748b">blast radius</text>
    </g>

    <!-- temporal memory: 337ms -> log10(337) ≈ 2.53 -> y = 20 + 2.53*60 ≈ 172 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="172" width="60" height="48" rx="4" fill="url(#barGrad3)" filter="url(#barGlow)"/>
      <text x="30" y="163" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#ec4899">337ms</text>
      <text x="30" y="188" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">p50: 284ms</text>
      <text x="30" y="230" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="white">Temporal Memory</text>
      <text x="30" y="245" text-anchor="middle" font-family="system-ui" font-size="8" fill="#64748b">CRUD ops</text>
    </g>

    <!-- end-to-end: 3818ms -> log10(3818) ≈ 3.58 -> y = 20 + 3.58*60 ≈ 235 (capped at 220) -->
    <g transform="translate(305, 0)">
      <rect x="0" y="22" width="60" height="218" rx="4" fill="url(#barGrad4)" filter="url(#barGlow)"/>
      <text x="30" y="13" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#22c55e">3818ms</text>
      <text x="30" y="38" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">p50: 3107ms</text>
      <text x="30" y="230" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="white">End-to-End</text>
      <text x="30" y="245" text-anchor="middle" font-family="system-ui" font-size="8" fill="#64748b">full pipeline</text>
    </g>

    <!-- Y-axis label -->
    <text x="-50" y="110" text-anchor="middle" font-family="system-ui" font-size="10" fill="#64748b" transform="rotate(-90, -50, 110)">Latency (log scale ms)</text>
  </g>

  <!-- Chart 2: Test Reduction Pie Chart -->
  <g transform="translate(600, 85)">
    <text x="160" y="0" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="white">Test Reduction via Blast Radius Targeting</text>

    <!-- Pie chart -->
    <g transform="translate(160, 130)">
      <!-- Full test suite (background) -->
      <circle cx="0" cy="0" r="80" fill="rgba(148,163,184,0.1)" stroke="#334155" stroke-width="2"/>
      <text x="0" y="-95" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">Full Suite: 50 tests</text>

      <!-- Targeted tests (green slice - 90%) -->
      <path d="M 0 0 L 80 0 A 80 80 0 0 1 -24.7 -76.3 Z" fill="url(#barGrad4)" filter="url(#barGlow)"/>
      <text x="0" y="-40" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#22c55e">90%</text>
      <text x="0" y="-20" text-anchor="middle" font-family="system-ui" font-size="10" fill="white">REDUCTION</text>

      <!-- Remaining tests (10%) -->
      <path d="M 0 0 L -24.7 -76.3 A 80 80 0 0 0 80 0 Z" fill="#f59e0b" opacity="0.8"/>
      <text x="50" y="40" text-anchor="middle" font-family="system-ui" font-size="9" fill="#f59e0b" font-weight="600">10% run</text>
      <text x="50" y="55" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94a3b8">(5 tests)</text>
    </g>

    <!-- Legend -->
    <g font-family="system-ui" font-size="10" transform="translate(80, 230)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#barGrad4)"/>
      <text x="22" y="11" fill="#22c55e">Targeted tests (5)</text>

      <rect x="0" y="25" width="14" height="14" rx="3" fill="#f59e0b" opacity="0.8"/>
      <text x="22" y="36" fill="#f59e0b">Skipped tests (45)</text>

      <rect x="160" y="0" width="14" height="14" rx="3" fill="rgba(148,163,184,0.2)" stroke="#334155"/>
      <text x="182" y="11" fill="#94a3b8">Full suite (50)</text>
    </g>
  </g>

  <!-- Chart 3: Pipeline Stage Breakdown -->
  <g transform="translate(60, 300)">
    <text x="0" y="0" font-family="system-ui" font-size="13" font-weight="600" fill="white">End-to-End Pipeline Stage Breakdown</text>

    <!-- Horizontal stacked bar -->
    <g transform="translate(0, 30)">
      <!-- Triage: ~150ms (4%) -->
      <rect x="0" y="0" width="16" height="30" rx="4 0 0 4" fill="rgba(139,92,246,0.8)"/>
      <text x="8" y="30" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8b5cf6">Triage</text>

      <!-- Ingest: ~200ms (5%) -->
      <rect x="16" y="0" width="20" height="30" fill="rgba(6,182,212,0.8)"/>
      <text x="26" y="30" text-anchor="middle" font-family="system-ui" font-size="8" fill="#06b6d4">Ingest</text>

      <!-- BlastRadius: ~95ms (2.5%) -->
      <rect x="36" y="0" width="10" height="30" fill="rgba(236,72,153,0.8)"/>
      <text x="41" y="30" text-anchor="middle" font-family="system-ui" font-size="8" fill="#ec4899">Path</text>

      <!-- PageRank: ~28ms (0.7%) -->
      <rect x="46" y="0" width="3" height="30" fill="rgba(139,92,246,0.6)"/>
      <text x="47" y="30" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8b5cf6">PR</text>

      <!-- Memory Curator: ~330ms (8.5%) -->
      <rect x="49" y="0" width="34" height="30" fill="rgba(34,197,94,0.8)"/>
      <text x="66" y="30" text-anchor="middle" font-family="system-ui" font-size="8" fill="#22c55e">Curator</text>

      <!-- Graph overhead: ~3100ms (81%) -->
      <rect x="83" y="0" width="317" height="30" rx="0 4 4 0" fill="rgba(148,163,184,0.3)" stroke="#334155" stroke-width="0.5"/>
      <text x="240" y="30" text-anchor="middle" font-family="system-ui" font-size="8" fill="#64748b">Graph overhead (connection, schema, isolation)</text>

      <!-- Scale -->
      <text x="400" y="30" text-anchor="end" font-family="system-ui" font-size="9" fill="#94a3b8">3818ms total</text>
    </g>

    <!-- Legend -->
    <g font-family="system-ui" font-size="9" transform="translate(0, 80)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="rgba(139,92,246,0.8)"/>
      <text x="18" y="10" fill="#8b5cf6">Triage Agent (fault extraction)</text>

      <rect x="180" y="0" width="12" height="12" rx="2" fill="rgba(6,182,212,0.8)"/>
      <text x="198" y="10" fill="#06b6d4">Data Ingestion</text>

      <rect x="330" y="0" width="12" height="12" rx="2" fill="rgba(236,72,153,0.8)"/>
      <text x="348" y="10" fill="#ec4899">shortestPath Tracing</text>

      <rect x="500" y="0" width="12" height="12" rx="2" fill="rgba(139,92,246,0.6)"/>
      <text x="518" y="10" fill="#8b5cf6">PageRank Blast Radius</text>

      <rect x="0" y="25" width="12" height="12" rx="2" fill="rgba(34,197,94,0.8)"/>
      <text x="18" y="35" fill="#22c55e">Memory Curator (facts, playbooks)</text>

      <rect x="330" y="25" width="12" height="12" rx="2" fill="rgba(148,163,184,0.3)" stroke="#334155"/>
      <text x="348" y="35" fill="#64748b">Graph Connection/Schema Overhead</text>
    </g>
  </g>

  <!-- Key findings -->
  <g transform="translate(600, 300)">
    <rect x="0" y="0" width="340" height="130" rx="10" fill="rgba(15,23,42,0.8)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="170" y="22" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#06b6d4">Key Findings</text>

    <g font-family="system-ui" font-size="9" fill="#e2e8f0" transform="translate(15, 35)">
      <text x="0" y="0">✓ shortestPath: &lt; 100ms — meets real-time SLA</text>
      <text x="0" y="20">✓ PageRank blast radius: &lt; 30ms — sub-linear scaling</text>
      <text x="0" y="40">✓ 90% test reduction — blast radius targeting works</text>
      <text x="0" y="60">⚠ End-to-end dominated by graph connection overhead</text>
      <text x="0" y="80">⚠ Temporal memory: 337ms — schema validation cost</text>
      <text x="0" y="100">→ Optimization: connection pooling, schema caching</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="500" y="435" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">
    Benchmark run: 2026-10-18 • FalkorDB docker (latest) • Python 3.12 • 10 iterations each • Results: benchmark_results.json
  </text>
</svg>