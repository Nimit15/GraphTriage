services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  demo:
    build: .
    command: ["python", "scripts/run_live_demo.py"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
      FALKORDB_SSL: "false"
      GRAPH_NAME: graphtriage_demo
      PYTHONPATH: /app
    depends_on:
      falkordb:
        condition: service_healthy
    profiles: ["demo"]

  mcp-server:
    build: .
    command: ["python", "-m", "src.mcp.mcp_server"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
      FALKORDB_SSL: "false"
      GRAPH_NAME: graphtriage
      PYTHONPATH: /app
    depends_on:
      falkordb:
        condition: service_healthy
    profiles: ["mcp"]

volumes:
  falkordb_data:
