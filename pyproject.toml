[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtriage"
version = "1.0.0"
description = "Graph-Triage — AI engineering agent for tracing software dependencies using FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Graph Hacks 2026" }]
keywords = ["falkordb", "graphrag", "mcp", "ai-agents", "knowledge-graph"]
dependencies = [
    "falkordb>=0.4.0",
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "streamlit>=1.30.0",
]

[tool.setuptools]
packages = ["src", "src.core", "src.graph", "src.mcp", "src.agents", "sandbox_service"]

[tool.pytest.ini_options]
testpaths = ["tests", "sandbox_service"]
asyncio_mode = "auto"