[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtriage"
version = "1.0.0"
description = "Graph-grounded incident investigation and temporal memory with FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GraphTriage contributors" }]
keywords = ["falkordb", "mcp", "ai-agents", "knowledge-graph"]

dependencies = [
    "falkordb>=0.4.0",
    "mcp>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "sandbox_service*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "sandbox_service"]
asyncio_mode = "auto"
