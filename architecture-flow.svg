<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#edgeGrad)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white">System Architecture</text>

  <!-- Layer 1: Input Layer -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="350" height="140" rx="12" fill="rgba(15,23,42,0.8)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="175" y="30" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#06b6d4">INPUT LAYER</text>

    <!-- Stack Trace Input -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="130" height="50" rx="8" fill="url(#nodeGrad1)" filter="url(#shadow)"/>
      <text x="65" y="20" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="white">Stack Trace</text>
      <text x="65" y="38" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)">KeyError: income</text>
    </g>

    <!-- Failing Test Input -->
    <g transform="translate(190, 50)">
      <rect x="0" y="0" width="130" height="50" rx="8" fill="url(#nodeGrad1)" filter="url(#shadow)"/>
      <text x="65" y="20" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="white">Failing Test</text>
      <text x="65" y="38" text-anchor="middle" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.8)">test_incident_...</text>
    </g>
  </g>

  <!-- Arrow down from input -->
  <path d="M 225 220 L 225 250" stroke="url(#edgeGrad)" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Layer 2: Triage Agent -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="350" height="100" rx="12" fill="rgba(15,23,42,0.8)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#8b5cf6">TRIAGE AGENT</text>

    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="130" height="40" rx="6" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1"/>
      <text x="65" y="14" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#8b5cf6">Extract</text>
      <text x="65" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.7)">Fault Signature</text>
    </g>

    <g transform="translate(190, 40)">
      <rect x="0" y="0" width="130" height="40" rx="6" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1"/>
      <text x="65" y="14" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#8b5cf6">Record</text>
      <text x="65" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.7)">EpisodicIncident</text>
    </g>
  </g>

  <!-- Arrow down from triage -->
  <path d="M 225 350 L 225 380" stroke="url(#edgeGrad)" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Layer 3: Blast Radius Agent -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="rgba(15,23,42,0.8)" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#ec4899">BLAST RADIUS AGENT</text>

    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="130" height="40" rx="6" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1"/>
      <text x="65" y="14" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#ec4899">shortestPath</text>
      <text x="65" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.7)">Trace Failure Path</text>
    </g>

    <g transform="translate(190, 40)">
      <rect x="0" y="0" width="130" height="40" rx="6" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1"/>
      <text x="65" y="14" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#ec4899">PageRank</text>
      <text x="65" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.7)">Calculate Blast Radius</text>
    </g>

    <g transform="translate(105, 90)">
      <rect x="0" y="0" width="130" height="30" rx="6" fill="rgba(236,72,153,0.15)" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="65" y="18" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="500" fill="#ec4899">Root Cause + Affected Functions</text>
    </g>
  </g>

  <!-- Right side: Data Layer -->
  <g transform="translate(500, 80)">
    <!-- FalkorDB -->
    <rect x="0" y="0" width="400" height="450" rx="12" fill="rgba(15,23,42,0.6)" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="30" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#06b6d4">FALKORDB GRAPH</text>

    <!-- Workspace Isolation -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="170" height="180" rx="8" fill="rgba(6,182,212,0.08)" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="85" y="22" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#06b6d4">workspace_alpha</text>

      <g transform="translate(15, 35)">
        <!-- Nodes -->
        <circle cx="30" cy="30" r="20" fill="url(#nodeGrad1)" filter="url(#glow)"/>
        <text x="30" y="34" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="white">Test</text>

        <circle cx="110" cy="30" r="20" fill="url(#nodeGrad2)"/>
        <text x="110" y="34" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="white">Function</text>

        <circle cx="70" cy="85" r="20" fill="url(#nodeGrad3)"/>
        <text x="70" y="89" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="white">Module</text>

        <!-- Edges -->
        <path d="M 45 30 L 95 30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
        <path d="M 70 45 L 70 70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
        <path d="M 45 45 L 55 75" stroke="#64748b" stroke-width="1.5" fill="none"/>
      </g>

      <text x="85" y="150" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">db.select_graph()</text>
      <text x="85" y="165" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">isolated graphs</text>
    </g>

    <g transform="translate(210, 50)">
      <rect x="0" y="0" width="170" height="180" rx="8" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="85" y="22" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#8b5cf6">workspace_beta</text>

      <g transform="translate(15, 35)">
        <circle cx="30" cy="30" r="20" fill="url(#nodeGrad1)" opacity="0.5"/>
        <text x="30" y="34" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="white">Test</text>

        <circle cx="110" cy="30" r="20" fill="url(#nodeGrad2)" opacity="0.5"/>
        <text x="110" y="34" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="white">Function</text>

        <circle cx="70" cy="85" r="20" fill="url(#nodeGrad3)" opacity="0.5"/>
        <text x="70" y="89" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="700" fill="white">Module</text>

        <path d="M 45 30 L 95 30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" opacity="0.5"/>
      </g>

      <text x="85" y="150" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">complete isolation</text>
      <text x="85" y="165" text-anchor="middle" font-family="system-ui" font-size="9" fill="#64748b">no data leakage</text>
    </g>

    <!-- Memory Tiers -->
    <g transform="translate(20, 250)">
      <text x="185" y="0" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="white">THREE-TIER TEMPORAL MEMORY</text>

      <!-- Tier 1: Episodic -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="360" height="55" rx="8" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="80" y="20" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#06b6d4">Tier 1: EpisodicIncident</text>
        <text x="80" y="38" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94a3b8">Raw incidents · stack traces · timestamps · commit SHAs</text>
        <circle cx="30" cy="20" r="6" fill="#06b6d4"/>
      </g>

      <!-- Tier 2: Semantic -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="360" height="55" rx="8" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="80" y="20" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#8b5cf6">Tier 2: SemanticFact</text>
        <text x="80" y="38" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94a3b8">Derived truths · valid_from/valid_to · SUPERSEDED edges · confidence</text>
        <circle cx="30" cy="20" r="6" fill="#8b5cf6"/>
      </g>

      <!-- Tier 3: Playbook -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="360" height="55" rx="8" fill="rgba(236,72,153,0.12)" stroke="#ec4899" stroke-width="1.5"/>
        <text x="80" y="20" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#ec4899">Tier 3: ProceduralPlaybook</text>
        <text x="80" y="38" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94a3b8">Reusable fix patterns · applicability rules · versioned steps</text>
        <circle cx="30" cy="20" r="6" fill="#ec4899"/>
      </g>
    </g>

    <!-- MCP Server -->
    <g transform="translate(20, 420)">
      <rect x="0" y="0" width="360" height="50" rx="8" fill="rgba(148,163,184,0.1)" stroke="#64748b" stroke-width="1.5"/>
      <text x="180" y="20" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#64748b">MCP SERVER</text>
      <text x="180" y="38" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">trace_blast_radius · find_failure_path · run_targeted_tests</text>
    </g>
  </g>

  <!-- Arrow from Blast Radius to Memory Curator -->
  <path d="M 400 445 L 480 445" stroke="url(#edgeGrad)" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Layer 4: Memory Curator Agent -->
  <g transform="translate(480, 380)">
    <rect x="0" y="0" width="320" height="130" rx="12" fill="rgba(15,23,42,0.8)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="25" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#22c55e">MEMORY CURATOR AGENT</text>

    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="120" height="40" rx="6" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1"/>
      <text x="60" y="14" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#22c55e">Create</text>
      <text x="60" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.7)">SemanticFact</text>
    </g>

    <g transform="translate(160, 40)">
      <rect x="0" y="0" width="120" height="40" rx="6" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="1"/>
      <text x="60" y="14" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="600" fill="#22c55e">Find</text>
      <text x="60" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.7)">Playbooks</text>
    </g>

    <g transform="translate(90, 90)">
      <rect x="0" y="0" width="120" height="30" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="60" y="18" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="500" fill="#22c55e">Handoff Complete</text>
    </g>
  </g>

  <!-- Output -->
  <g transform="translate(50, 530)">
    <rect x="0" y="0" width="350" height="50" rx="8" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
    <text x="175" y="20" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#22c55e">OUTPUT: Resolved Incident</text>
    <text x="175" y="38" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">root_cause · blast_radius · playbook · semantic_facts</text>
  </g>

  <!-- Pipeline labels -->
  <g font-family="system-ui" font-size="10" font-weight="600">
    <text x="425" y="110" fill="#06b6d4">STAGE 1</text>
    <text x="425" y="300" fill="#8b5cf6">STAGE 2</text>
    <text x="425" y="445" fill="#22c55e">STAGE 3</text>
  </g>
</svg>