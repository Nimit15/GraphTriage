<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">GraphTriage architecture</title>
  <desc id="desc">Incident input flows through triage, impact analysis, and memory curation. FalkorDB stores graph-backed code and memory data.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#64748B"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.head{font-size:24px;font-weight:700;fill:#102235}.sub{font-size:16px;fill:#536779}.cardhead{font-size:19px;font-weight:700;fill:#102235}.body{font-size:16px;fill:#30465A}.small{font-size:13px;fill:#61778B}</style>
  </defs>
  <rect width="1200" height="430" rx="16" fill="#F7F9FC" stroke="#D7E0E8"/>
  <text class="head" x="38" y="47">System architecture</text>
  <text class="sub" x="38" y="74">An incident moves through three agent stages, with FalkorDB providing persistent graph state.</text>
  <g>
    <rect x="35" y="122" width="190" height="184" rx="12" fill="#FFFFFF" stroke="#C6D4DF" stroke-width="1.5"/>
    <rect x="35" y="122" width="190" height="8" rx="4" fill="#0E7490"/>
    <text class="cardhead" x="55" y="164">Input</text><text class="body" x="55" y="199">Stack trace</text><text class="body" x="55" y="226">Failing test</text><text class="body" x="55" y="253">Session context</text><text class="small" x="55" y="284">Incident evidence</text>
    <rect x="266" y="122" width="190" height="184" rx="12" fill="#FFFFFF" stroke="#C6D4DF" stroke-width="1.5"/>
    <rect x="266" y="122" width="190" height="8" rx="4" fill="#2563EB"/>
    <text class="cardhead" x="286" y="164">TriageAgent</text><text class="body" x="286" y="199">Parse fault signature</text><text class="body" x="286" y="226">Validate entities</text><text class="body" x="286" y="253">Record incident</text><text class="small" x="286" y="284">Episodic memory</text>
    <rect x="497" y="122" width="190" height="184" rx="12" fill="#FFFFFF" stroke="#C6D4DF" stroke-width="1.5"/>
    <rect x="497" y="122" width="190" height="8" rx="4" fill="#FF8101"/>
    <text class="cardhead" x="517" y="164">BlastRadiusAgent</text><text class="body" x="517" y="199">Trace graph links</text><text class="body" x="517" y="226">Estimate impact</text><text class="body" x="517" y="253">Identify tests</text><text class="small" x="517" y="284">Evidence-backed result</text>
    <rect x="728" y="122" width="190" height="184" rx="12" fill="#FFFFFF" stroke="#C6D4DF" stroke-width="1.5"/>
    <rect x="728" y="122" width="190" height="8" rx="4" fill="#059669"/>
    <text class="cardhead" x="748" y="164">MemoryCurator</text><text class="body" x="748" y="199">Store incident</text><text class="body" x="748" y="226">Update semantic facts</text><text class="body" x="748" y="253">Retrieve playbooks</text><text class="small" x="748" y="284">Persistent memory</text>
    <rect x="959" y="122" width="206" height="184" rx="12" fill="#EAF5FA" stroke="#8DBACB" stroke-width="1.5"/>
    <text x="981" y="164" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0E5269">FalkorDB</text><text class="body" x="981" y="199">Code entities</text><text class="body" x="981" y="226">Test relationships</text><text class="body" x="981" y="253">Incident and memory</text><text class="small" x="981" y="284">Property graph</text>
    <g stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"><path d="M225 211 H258"/><path d="M456 211 H489"/><path d="M687 211 H720"/><path d="M918 211 H951"/></g>
  </g>
  <rect x="266" y="343" width="652" height="54" rx="10" fill="#EEF5F8" stroke="#C8D8E2"/>
  <text x="592" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#214255">Shared graph context</text>
  <text x="592" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">Agents query and update workspace-specific graph state.</text>
</svg>